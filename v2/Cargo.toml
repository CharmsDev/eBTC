[package]
name = "ebtc_v2"
description = "eBTC locked on Scrolls outputs"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
charms-sdk = { git = "https://github.com/CharmsDev/charms", rev = "2b066081b3877aa8dd68540d5de6386b1a7d0d08" }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10.9"

[dev-dependencies]
bitcoin = "0.32"
charms-client = { git = "https://github.com/CharmsDev/charms", rev = "2b066081b3877aa8dd68540d5de6386b1a7d0d08" }
charms-data = { git = "https://github.com/CharmsDev/charms", rev = "2b066081b3877aa8dd68540d5de6386b1a7d0d08" }
hex = "0.4"
secp256k1 = { version = "0.29", features = ["std"] }
serde_yaml = "0.9"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
overflow-checks = true

[workspace]
